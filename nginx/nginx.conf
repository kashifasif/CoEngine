user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Gzip compression for Blazor WebAssembly assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm;

    upstream specplatform_backend {
        server app:8080;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name spec-engine.ijsonformatter.com;

        # Cloudflare Reverse Proxy Configuration
        location / {
            proxy_pass         http://specplatform_backend;
            proxy_http_version 1.1;
            
            # WebSocket and SignalR support for Blazor
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            
            # Cloudflare & Standard Proxy Headers
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $http_cf_connecting_ip;
            proxy_set_header   X-Forwarded-For $http_cf_connecting_ip;
            # Tell ASP.NET Core the request came over HTTPS via Cloudflare
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host $host;
            
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
