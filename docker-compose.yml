services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. SpecPlatform App (ASP.NET Core API + Blazor WASM Frontend)
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: specplatform_app
    restart: always
    ports:
      # Bound to localhost so host VM's Nginx can reverse proxy traffic directly
      - "127.0.0.1:5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Connects directly to internal postgres container on the private network
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-specplatform_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_secure_pass}"
      GitHub__ClientId: ${GITHUB_CLIENT_ID}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
      GitHub__AppBaseUrl: ${APP_BASE_URL:-https://topvid.lol}
      GitHub__CallbackPath: /auth/github/callback
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY}
      DeepSeek__Model: deepseek-chat
      DeepSeek__BaseUrl: https://api.deepseek.com/chat/completions
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - specplatform_net

  # ─────────────────────────────────────────────────────────────────────────
  # 2. PostgreSQL Database Service with pgvector - Isolated
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: specplatform_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-specplatform_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    # Isolated to internal Docker network only — NOT exposed directly to the host
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-specplatform_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - specplatform_net

volumes:
  postgres_data:
    driver: local

networks:
  specplatform_net:
    driver: bridge
