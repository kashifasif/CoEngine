services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Reverse Proxy (Nginx) - Public entrypoint
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: specplatform_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - app
    networks:
      - specplatform_net

  # ─────────────────────────────────────────────────────────────────────────
  # 2. SpecPlatform App (ASP.NET Core API + Blazor WASM Frontend)
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: specplatform_app
    restart: always
    # Private to internal Docker network only — accessed via Nginx reverse proxy
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Connects directly to internal postgres container on network
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-specplatform_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_secure_pass}"
      GitHub__ClientId: ${GITHUB_CLIENT_ID}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
      GitHub__AppBaseUrl: ${APP_BASE_URL:-https://spec-engine.ijsonformatter.com}
      GitHub__CallbackPath: /auth/github/callback
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY}
      DeepSeek__Model: deepseek-chat
      DeepSeek__BaseUrl: https://api.deepseek.com/chat/completions
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - specplatform_net

  # ─────────────────────────────────────────────────────────────────────────
  # 3. PostgreSQL Database Service with pgvector - Isolated
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: specplatform_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-specplatform_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    # Isolated to internal Docker network only — NOT exposed to the public/host
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-specplatform_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - specplatform_net

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Dozzle - Lightweight log viewer, with basic auth, exposed publicly
  # ─────────────────────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: specplatform_dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    networks:
      - specplatform_net

volumes:
  postgres_data:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
  dozzle_data:
    driver: local

networks:
  specplatform_net:
    driver: bridge
