<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecPlatform — Specification Engine</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SpecPlatform.Client.styles.css" rel="stylesheet" />
    <script>
        window.themeManager = {
            setTheme: function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('theme_preference', theme);
            },
            getTheme: function () {
                return localStorage.getItem('theme_preference') || 'dark';
            }
        };
        (function () {
            var savedTheme = localStorage.getItem('theme_preference') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>

<body class="bg-bg-base text-text-base min-h-screen flex flex-col font-ui overflow-x-hidden antialiased">
    <div id="app">
        <div class="flex flex-col justify-center items-center min-h-screen bg-bg-base">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-500 mb-4"></div>
            <h5 class="text-xl font-semibold text-white mb-2">Loading SpecPlatform Engine...</h5>
            <p class="text-slate-400 text-sm font-mono">Initializing Technical Precision Design System & AI Vector Store</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/specExporter.js"></script>
</body>
</html>
