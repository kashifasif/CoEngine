<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecPlatform — Specification Engine</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SpecPlatform.Client.styles.css" rel="stylesheet" />
    <script>
        window.themeManager = {
            setTheme: function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('theme_preference', theme);
            },
            getTheme: function () {
                return localStorage.getItem('theme_preference') || 'dark';
            }
        };

        window.chatScrollManager = {
            initInfiniteScroll: function (containerId, dotNetHelper) {
                const el = document.getElementById(containerId);
                if (!el) return;
                
                el.onscroll = function () {
                    if (el.scrollTop < 60) {
                        const prevScrollHeight = el.scrollHeight;
                        const prevScrollTop = el.scrollTop;

                        dotNetHelper.invokeMethodAsync("OnLoadOlderMessagesAsync")
                            .then((loadedCount) => {
                                if (loadedCount > 0) {
                                    requestAnimationFrame(() => {
                                        const newScrollHeight = el.scrollHeight;
                                        el.scrollTop = (newScrollHeight - prevScrollHeight) + prevScrollTop;
                                    });
                                }
                            })
                            .catch(() => {});
                    }
                };
            },
            scrollToBottom: function (containerId, smooth) {
                const el = document.getElementById(containerId);
                if (el) {
                    if (smooth) {
                        el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                    } else {
                        el.scrollTop = el.scrollHeight;
                    }
                }
            },
            getScrollTop: function (containerId) {
                const el = document.getElementById(containerId);
                return el ? el.scrollTop : 0;
            },
            setScrollTop: function (containerId, pos) {
                const el = document.getElementById(containerId);
                if (el) {
                    el.scrollTop = pos;
                }
            }
        };

        window.downloadFileFromText = function (filename, content, mimeType) {
            const blob = new Blob([content], { type: mimeType || 'text/markdown;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        window.notificationScrollManager = {
            initInfiniteScroll: function (containerId, dotNetHelper) {
                const el = document.getElementById(containerId);
                if (!el) return;
                el.onscroll = function () {
                    if (el.scrollHeight - el.scrollTop - el.clientHeight < 30) {
                        dotNetHelper.invokeMethodAsync("OnLoadOlderNotificationsAsync");
                    }
                };
            }
        };

        (function () {
            var savedTheme = localStorage.getItem('theme_preference') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <style>
        #app-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            background-color: #fafafa;
            color: #18181b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 1.5rem;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        html.dark #app-loader,
        html[data-theme="dark"] #app-loader {
            background-color: #09090b;
            color: #f4f4f5;
        }

        .loader-icon-box {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(79, 70, 229, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        html.dark .loader-icon-box,
        html[data-theme="dark"] .loader-icon-box {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(129, 140, 248, 0.3);
        }

        .loader-spinner-ring {
            position: absolute;
            inset: -6px;
            border-radius: 20px;
            border: 2px solid transparent;
            border-top-color: #4f46e5;
            border-right-color: #6366f1;
            animation: spinRing 1s linear infinite;
        }

        html.dark .loader-spinner-ring,
        html[data-theme="dark"] .loader-spinner-ring {
            border-top-color: #818cf8;
            border-right-color: #a5b4fc;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 0.35rem 0;
            color: inherit;
        }

        .loader-subtitle {
            font-size: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #71717a;
            margin: 0;
            max-width: 320px;
            line-height: 1.4;
        }

        html.dark .loader-subtitle,
        html[data-theme="dark"] .loader-subtitle {
            color: #a1a1aa;
        }

        .loader-bar-bg {
            width: 160px;
            height: 4px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 1.25rem;
            position: relative;
        }

        html.dark .loader-bar-bg,
        html[data-theme="dark"] .loader-bar-bg {
            background: rgba(255, 255, 255, 0.1);
        }

        .loader-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 40%;
            background: linear-gradient(90deg, #4f46e5, #818cf8);
            border-radius: 9999px;
            animation: progressPulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes progressPulse {
            0% { left: 0%; width: 25%; }
            100% { left: 65%; width: 35%; }
        }
    </style>
</head>

<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col antialiased">
    <div id="app">
        <div id="app-loader">
            <div class="loader-icon-box">
                <span class="material-symbols-outlined" style="font-size: 28px; color: #6366f1;">auto_awesome</span>
                <div class="loader-spinner-ring"></div>
            </div>
            <h5 class="loader-title">Loading SpecPlatform Engine</h5>
            <p class="loader-subtitle">Initializing technical workspace &amp; vector store...</p>
            <div class="loader-bar-bg">
                <div class="loader-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/specExporter.js"></script>
</body>
</html>
